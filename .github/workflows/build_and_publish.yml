name: Build and publish to PyPI

on:
  push:
    branches:
      - main
      - dev
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # parasail has no macOS arm64 pre-built wheel, so
      # we need autotools (glibtoolize/autoconf/automake) on macOS
      - name: Install parasail build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install autoconf automake libtool

      - name: Install build dependencies
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Test pip install from built wheel
        run: |
          pip install dist/*.whl
          longhap --help
          longhap --version

      - name: Test pip install - sequence-only phasing
        run: |
          longhap \
            --vcf example/deepvariant.vcf.gz \
            --bam example/pacbio.bam \
            --reference example/toy_reference.fa \
            --chrom chr1 \
            --pacbio \
            -o example/phased_variants_pip_seq.vcf.gz \
            --verbose

      - name: Test pip install - sequence and methylation phasing
        run: |
          longhap \
            --vcf example/deepvariant.vcf.gz \
            --bam example/pacbio.bam \
            --methylation_calls example/methylation.bed \
            --reference example/toy_reference.fa \
            --chrom chr1 \
            --pacbio \
            -o example/phased_variants_pip_meth.vcf.gz \
            --verbose

  build_and_publish:
    needs: test
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write  # attach example.tar.gz to the release
      id-token: write  # trusted publishing to PyPI
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Attach example data to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -czf example.tar.gz example/
          gh release upload "${{ github.event.release.tag_name }}" example.tar.gz --clobber

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
