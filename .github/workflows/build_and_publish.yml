name: Build and publish to PyPI

on:
  push:
    branches:
      - main
      - dev
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Test pip install from built wheel
        run: |
          pip install dist/*.whl
          longhap --help
          longhap --version

      - name: Test pip install - sequence-only phasing
        run: |
          longhap \
            --vcf example/deepvariant.vcf.gz \
            --bam example/pacbio.bam \
            --reference example/toy_reference.fa \
            --chrom chr1 \
            --pacbio \
            -o example/phased_variants_pip_seq.vcf.gz \
            --verbose

      - name: Test pip install - sequence and methylation phasing
        run: |
          longhap \
            --vcf example/deepvariant.vcf.gz \
            --bam example/pacbio.bam \
            --methylation_calls example/methylation.bed \
            --reference example/toy_reference.fa \
            --chrom chr1 \
            --pacbio \
            -o example/phased_variants_pip_meth.vcf.gz \
            --verbose

      - name: Test conda install from source
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: longhap
          environment-file: longhap.yaml
          conda-remove-defaults: "true"

      - name: Test longhap via conda environment
        shell: bash -el {0}
        run: |
          conda activate longhap
          ./longhap.py --help
          ./longhap.py --version

      - name: Test conda install - sequence-only phasing
        shell: bash -el {0}
        run: |
          conda activate longhap
          ./longhap.py \
            --vcf example/deepvariant.vcf.gz \
            --bam example/pacbio.bam \
            --reference example/toy_reference.fa \
            --chrom chr1 \
            --pacbio \
            -o example/phased_variants_conda_seq.vcf.gz \
            --verbose

      - name: Test conda install - sequence and methylation phasing
        shell: bash -el {0}
        run: |
          conda activate longhap
          ./longhap.py \
            --vcf example/deepvariant.vcf.gz \
            --bam example/pacbio.bam \
            --methylation_calls example/methylation.bed \
            --reference example/toy_reference.fa \
            --chrom chr1 \
            --pacbio \
            -o example/phased_variants_conda_meth.vcf.gz \
            --verbose

      - name: Upload build artifacts
        if: github.event_name == 'release'
        uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: 
      name: pypi
      url: https://pypi.org/p/longhap
    permissions:
      id-token: write
    if: github.event_name == 'release'
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
